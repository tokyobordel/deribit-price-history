
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: deribit_prices
      POSTGRES_USER: deribit
      POSTGRES_PASSWORD: deribit_dev

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U deribit -d deribit_prices
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

volumes:
  postgres_data:
